name: Build & Deploy

# When the source branch changes (a dev push, or the CMS saving a post),
# rebuild the static site and publish it to `main`, which Hostinger serves.
on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the static site
        run: python build-site.py

      - name: Publish dist/ to the main branch (fast-forward, so Hostinger's pull works)
        run: |
          REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          rm -rf out
          git clone --depth 1 --branch main "$REPO" out
          # replace all tracked files with the fresh build, keeping main's .git history
          find out -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a dist/. out/
          cd out
          git config user.name "silstone-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes to deploy"; exit 0; fi
          git commit -m "Deploy from source@${GITHUB_SHA::7}"
          git push origin main
