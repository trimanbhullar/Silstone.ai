<!-- @dsCard group="Spacing" viewport="700x220" name="Radius & Shadow" subtitle="Corner radii + elevation used on cards/buttons" -->
<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-canvas);padding:20px;font-family:var(--font-body);color:var(--text-secondary);font-size:12px;display:flex;gap:16px;}
.box{width:110px;height:110px;background:var(--bg-surface);display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;border:1px solid var(--border-subtle);}
</style></head>
<body>
<div class="box" style="border-radius:var(--radius-sm)">sm 6px</div>
<div class="box" style="border-radius:var(--radius-md)">md 10px</div>
<div class="box" style="border-radius:var(--radius-lg)">lg 16px</div>
<div class="box" style="border-radius:var(--radius-xl)">xl 24px</div>
<div class="box" style="border-radius:var(--radius-pill);box-shadow:var(--shadow-accent-glow);border-color:var(--border-accent)">pill + glow</div>
</body></html>
