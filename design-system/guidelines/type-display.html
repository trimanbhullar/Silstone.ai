<!-- @dsCard group="Type" viewport="700x300" name="Display Type Scale" subtitle="Poppins — headings, bold, tight tracking" -->
<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-canvas);padding:20px;font-family:var(--font-display);color:var(--text-primary);}
p{margin:0 0 10px;}
</style></head>
<body>
<p style="font-size:var(--text-display-xl-size);font-weight:var(--text-display-xl-weight);line-height:var(--text-display-xl-leading);letter-spacing:var(--tracking-tight)">Display XL</p>
<p style="font-size:var(--text-display-l-size);font-weight:var(--text-display-l-weight);line-height:var(--text-display-l-leading);letter-spacing:var(--tracking-tight)">Display L</p>
<p style="font-size:var(--text-display-m-size);font-weight:var(--text-display-m-weight);line-height:var(--text-display-m-leading)">Display M</p>
<p style="font-size:var(--text-display-s-size);font-weight:var(--text-display-s-weight);line-height:var(--text-display-s-leading)">Display S</p>
</body></html>
