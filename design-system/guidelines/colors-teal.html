<!-- @dsCard group="Colors" viewport="700x160" name="Teal Accent Scale" subtitle="Primary brand accent, sampled from logo/hero" -->
<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--bg-canvas);font-family:var(--font-body);padding:20px;}
.row{display:flex;height:80px;border-radius:var(--radius-md);overflow:hidden;}
.sw{flex:1;display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#000;}
.sw.dark{color:#fff;}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--teal-50)">50</div>
  <div class="sw" style="background:var(--teal-100)">100</div>
  <div class="sw" style="background:var(--teal-200)">200</div>
  <div class="sw" style="background:var(--teal-300)">300</div>
  <div class="sw" style="background:var(--teal-400)">400</div>
  <div class="sw" style="background:var(--teal-500)">500</div>
  <div class="sw dark" style="background:var(--teal-600)">600</div>
  <div class="sw dark" style="background:var(--teal-700)">700</div>
  <div class="sw dark" style="background:var(--teal-800)">800</div>
  <div class="sw dark" style="background:var(--teal-900)">900</div>
</div>
</body></html>
