<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing Scale" subtitle="4px base scale used across padding/gaps" -->
<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg-canvas);padding:20px;font-family:var(--font-mono);color:var(--text-secondary);font-size:11px;}
.row{display:flex;align-items:flex-end;gap:8px;height:90px;}
.bar{background:var(--accent);border-radius:2px 2px 0 0;width:24px;display:flex;align-items:flex-end;justify-content:center;color:#000;font-size:10px;padding-bottom:2px;}
</style></head>
<body>
<div class="row">
<div class="bar" style="height:4px">1</div>
<div class="bar" style="height:8px">2</div>
<div class="bar" style="height:12px">3</div>
<div class="bar" style="height:16px">4</div>
<div class="bar" style="height:20px">5</div>
<div class="bar" style="height:24px">6</div>
<div class="bar" style="height:32px">8</div>
<div class="bar" style="height:40px">10</div>
<div class="bar" style="height:48px">12</div>
<div class="bar" style="height:64px">16</div>
</div>
</body></html>
