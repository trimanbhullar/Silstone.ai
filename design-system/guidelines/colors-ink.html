<!-- @dsCard group="Colors" viewport="700x160" name="Ink / Neutral Scale" subtitle="Dark-mode canvas + surfaces" -->
<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--bg-canvas);font-family:var(--font-body);padding:20px;}
.row{display:flex;height:80px;border-radius:var(--radius-md);overflow:hidden;}
.sw{flex:1;display:flex;align-items:flex-end;padding:8px;font-size:11px;color:#fff;}
.sw.light{color:#000;}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--black)">black</div>
  <div class="sw" style="background:var(--ink-900)">900</div>
  <div class="sw" style="background:var(--ink-800)">800</div>
  <div class="sw" style="background:var(--ink-700)">700</div>
  <div class="sw" style="background:var(--ink-600)">600</div>
  <div class="sw" style="background:var(--ink-500)">500</div>
  <div class="sw" style="background:var(--ink-400)">400</div>
  <div class="sw light" style="background:var(--ink-300)">300</div>
  <div class="sw light" style="background:var(--ink-200)">200</div>
  <div class="sw light" style="background:var(--ink-100)">100</div>
</div>
</body></html>
