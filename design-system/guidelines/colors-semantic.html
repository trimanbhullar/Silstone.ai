<!-- @dsCard group="Colors" viewport="700x180" name="Semantic Surfaces & Text" subtitle="How base colors map to UI roles" -->
<!DOCTYPE html>
<html>
<head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--bg-canvas);font-family:var(--font-body);padding:20px;display:flex;gap:12px;}
.card{flex:1;border-radius:var(--radius-lg);padding:16px;font-size:13px;}
</style></head>
<body>
<div class="card" style="background:var(--bg-canvas-true-black);border:1px solid var(--border-subtle);color:var(--text-primary)">bg-canvas-true-black<br><span style="color:var(--text-secondary)">text-secondary</span></div>
<div class="card" style="background:var(--bg-surface);border:1px solid var(--border-subtle);color:var(--text-primary)">bg-surface<br><span style="color:var(--text-tertiary)">text-tertiary</span></div>
<div class="card" style="background:var(--bg-surface-raised);border:1px solid var(--border-accent);color:var(--text-accent)">bg-surface-raised<br>border-accent / text-accent</div>
<div class="card" style="background:var(--bg-inverse);color:var(--text-inverse)">bg-inverse<br>text-inverse</div>
</body></html>
